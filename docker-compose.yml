version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: retail_intel_db
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: retail_secure_password_2026
      POSTGRES_DB: retail_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail_user -d retail_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retail_intel_api
    command: uvicorn app.main:create_app --host 0.0.0.0 --port 8000 --factory --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Retail Intelligence Platform
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://retail_user:retail_secure_password_2026@db:5432/retail_intelligence
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
